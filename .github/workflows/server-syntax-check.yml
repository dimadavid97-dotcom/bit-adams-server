name: Server syntax check

on:
  pull_request:
    paths:
      - 'server.js'
      - '.github/workflows/server-syntax-check.yml'
  push:
    branches:
      - main
      - 'fix/twelvedata-quota-safe-scan'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server.js syntax
        run: node --check server.js
