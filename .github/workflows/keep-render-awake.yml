name: Keep BIT ADAMS server awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: curl --fail --silent --show-error --retry 2 --retry-delay 15 --retry-all-errors --max-time 90 https://bit-adams-server.onrender.com/health
